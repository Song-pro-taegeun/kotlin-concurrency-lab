server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kotlin-concurrency-lab
  datasource:
    url: jdbc:mariadb://localhost:${DB_PORT:3308}/${DB_NAME:kotlin_concurrency_lab}
    username: ${DB_USERNAME:kotlin}
    password: ${DB_PASSWORD:kotlin}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: false

lab:
  blocking-delay: 500ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
